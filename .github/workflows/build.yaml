name: Publish to GHCR

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      IMAGE: ghcr.io/${{ github.repository }}/grafana-image-renderer
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build -t "$IMAGE:5.12.10-wh" -t "$IMAGE:sha-$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
